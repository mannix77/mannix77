name: Weekly corpus check

# The series published on Mondays, so this runs Tuesday mornings UTC to pick up
# anything new, re-audits coverage, and runs the full test suite.
#
# NOTE: GitHub only fires scheduled workflows from the repository's default
# branch. Until this file is merged to master, the schedule will not run - use
# the "Run workflow" button (workflow_dispatch) to try it from a branch.

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
    inputs:
      skip_network:
        description: "Skip the archive check (offline validation only)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-corpus-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependencies to install - the project is stdlib only.
      - name: Run the weekly report
        id: report
        run: |
          set +e
          python3 tools/weekly_report.py \
            --out weekly-report.md \
            --json weekly-report.json \
            ${{ inputs.skip_network && '--skip-network' || '' }}
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          python3 -c "
          import json, pathlib
          report = json.loads(pathlib.Path('weekly-report.json').read_text())
          print('status=' + report['status'])
          print('new_count=' + str(report['corpus'].get('new_count') or 0))
          " >> "$GITHUB_OUTPUT"

      - name: Summarise in the run
        if: always()
        run: cat weekly-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            weekly-report.md
            weekly-report.json
          retention-days: 90

      - name: File or update the tracking issue
        if: always() && steps.report.outputs.status != 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.report.outputs.status }}
          NEW_COUNT: ${{ steps.report.outputs.new_count }}
        run: |
          set -euo pipefail
          LABEL="corpus-check"
          TITLE="Weekly corpus check: action needed"

          gh label create "$LABEL" \
            --description "Automated weekly corpus and coverage check" \
            --color BFD4F2 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label "$LABEL" \
            --json number --jq '.[0].number // empty')

          {
            echo "Status: **$STATUS** · new instalments upstream: **$NEW_COUNT**"
            echo
            cat weekly-report.md
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > issue-body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue-body.md
            echo "commented on #$EXISTING"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file issue-body.md
          fi

      - name: Fail the run if something is broken
        if: steps.report.outputs.status == 'broken'
        run: |
          echo "::error::Graph validation, tests or build failed - see the report above."
          exit 1
