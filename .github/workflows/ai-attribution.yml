name: AI attribution

# Required status check: fails any pull request whose commits or description lack
# valid provenance trailers.
#
# Tool-agnostic on purpose. Any AI tool can satisfy it with its own producer
# hook, and a change made without AI assistance satisfies it with
# `AI-Assisted: none`. Nothing here assumes Claude Code.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: AI attribution check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Bot-authored PRs are exempt for the same reason their commits are: upgrade
    # bots build their PR body from a changelog and ignore the PR template, and
    # cannot emit trailers. The bot identity in the author field is the attribution.
    if: github.event.pull_request.user.type != 'Bot'

    steps:
      - uses: actions/checkout@v4
        with:
          # The commit range check needs real history, not a shallow clone.
          fetch-depth: 0

      - name: Verify commit trailers
        run: |
          bash scripts/ai-attribution/check-commits.sh \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Verify the pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | bash scripts/ai-attribution/check-pr-body.sh -
