name: AI attribution audit

# Post-merge backstop. The pull-request check can be bypassed — an admin merge,
# a direct push to the default branch — so this re-checks what actually landed
# and opens an issue if anything unattributed got through.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit the pushed commits
        id: audit
        run: |
          set +e
          BEFORE="${{ github.event.before }}"
          # A new branch or a force-push can leave `before` as all zeros.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }} -n 20"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          echo "range=$RANGE"
          OUT="$(bash scripts/ai-attribution/check-commits.sh $RANGE 2>&1)"
          CODE=$?
          echo "$OUT"
          {
            echo 'report<<REPORT_EOF'
            echo "$OUT"
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "failed=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open an issue when unattributed commits land
        if: steps.audit.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.audit.outputs.report }}
        run: |
          set -euo pipefail
          LABEL="ai-attribution"
          gh label create "$LABEL" --description "AI provenance audit" --color D4C5F9 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          {
            echo "Unattributed commit(s) landed on \`master\` at ${{ github.sha }}."
            echo
            echo '```'
            printf '%s\n' "$REPORT"
            echo '```'
            echo
            echo "This is the post-merge backstop, so the pull-request check was bypassed or"
            echo "the push went straight to the branch. The commits cannot be rewritten on a"
            echo "shared branch — record the provenance here instead, and check why the gate"
            echo "did not apply."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "AI attribution: unattributed commits on master" \
              --label "$LABEL" --body-file body.md
          fi

      - name: Fail the run so the push is visibly red
        if: steps.audit.outputs.failed != '0'
        run: exit 1
